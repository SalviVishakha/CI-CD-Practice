name: Python CI   -AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t ci-cd-practice .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::600496202351:role/CICDECRRole
          aws-region: us-east-1

         - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag ci-cd-practice:latest 600496202351.dkr.ecr.us-east-1.amazonaws.com/ci-cd-practice:latest

      - name: Push Docker image to ECR
        run: |
          docker push 600496202351.dkr.ecr.us-east-1.amazonaws.com/ci-cd-practice:latest